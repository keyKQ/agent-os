[package]
name = "agentos-desktop"
version = "2026.8.28"
description = "AgentOS desktop application"
authors = ["AgentOS contributors"]
license = "Apache-2.0"
repository = "https://github.com/use-agent-os/agent-os"
edition = "2021"
rust-version = "1.77.2"

# The library target carries the whole app so the bundled runtime supervisor can
# be unit-tested; `main.rs` is a three-line shim around it.
[lib]
name = "agentos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
anyhow = "1"
log = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"], default-features = false }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Enabled by `tauri build`; keeps `cargo test` off the bundler code path.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
