name: Desktop Release Assets

# Builds the AgentOS desktop app for every supported platform and attaches the
# installers to the tag's GitHub release.
#
# Each job bundles its own Python runtime, so the wheelhouse must be resolved on
# the target platform -- `pip wheel` picks dependency wheels by the *host*
# platform's markers. That is why there is one runner per target rather than one
# cross-compiling job.

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional existing tag to upload artifacts to
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
  # Kept in step with scripts/build_wheelhouse_zip.py's defaults; both bundle
  # the same interpreter so a desktop install and a portable zip behave alike.
  PYTHON_RUNTIME_RELEASE: "20260414"
  PYTHON_RUNTIME_VERSION: "3.12.13"

jobs:
  build:
    name: ${{ matrix.platform_tag }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # Job level, not step level: a step's `if` can read the `env` context but
      # not `secrets`, so a signing step that wants to skip itself when no
      # certificate is configured has to test the value from here.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform_tag: macos-arm64
          # Intel macOS is a distinct runner image, not a cross-compile: the
          # wheelhouse has to resolve against the host's platform markers.
          - runner: macos-15-intel
            platform_tag: macos-x64
          - runner: windows-latest
            platform_tag: windows-x64
          - runner: ubuntu-22.04
            platform_tag: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || github.ref }}

      # The model weights are plain git objects now, so this pull is a no-op
      # kept as a belt against a stray LFS-tracked file ever reappearing; the
      # verify step below is what would actually catch one shipped un-hydrated.
      - name: Hydrate embedding and router assets
        shell: bash
        run: |
          git lfs pull --include="src/agentos/memory/models/**"
          git lfs pull --include="src/agentos/agentos_router/models/**"

      - name: Verify LFS assets are hydrated
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # An unhydrated pointer is ~130 bytes of text that imports fine and
          # then degrades every turn at runtime, so it has to fail here.
          roots = [
              Path("src/agentos/memory/models"),
              Path("src/agentos/agentos_router/models"),
          ]
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  prefix = path.read_bytes()[:64]
                  assert not prefix.startswith(b"version https://git-lfs.github.com/spec/v1"), (
                      f"LFS pointer not hydrated: {path}"
                  )
          PY

      - name: Install Linux webview toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse \
            libfuse2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install uv
        run: python -m pip install uv

      - name: Check tag version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          version="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tag_version="${RELEASE_TAG#v}"
          if [[ "${tag_version}" != "${version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match project version ${version}" >&2
            exit 1
          fi

      - name: Build the bundled runtime
        shell: bash
        run: |
          python scripts/build_desktop_runtime.py build \
            --platform-tag "${{ matrix.platform_tag }}" \
            --python-runtime-release "${PYTHON_RUNTIME_RELEASE}" \
            --python-runtime-version "${PYTHON_RUNTIME_VERSION}"

      - name: Report bundle size
        shell: bash
        run: du -sh desktop/src-tauri/resources

      # Signed before bundling, not after: Tauri's signature goes over an
      # already-signed resource tree, and codesign cannot seal unsigned nested
      # Mach-O binaries. See scripts/sign_macos_runtime.sh.
      - name: Sign the bundled runtime
        # Reads the job-level env, which is where APPLE_SIGNING_IDENTITY has to
        # live: the `secrets` context is not available in a step `if` at all,
        # and a step's own `env:` block is not in scope for its own condition.
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Import into a throwaway keychain so the certificate never lands in
          # the runner's login keychain or survives the job.
          KEYCHAIN="${RUNNER_TEMP}/agentos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "${APPLE_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${KEYCHAIN}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
          security list-keychain -d user -s "${KEYCHAIN}" login.keychain-db
          rm -f "${RUNNER_TEMP}/certificate.p12"

          bash scripts/sign_macos_runtime.sh "${APPLE_SIGNING_IDENTITY}"

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build installers
        working-directory: desktop/src-tauri
        shell: bash
        env:
          # Present only on release builds; the shell hides "Check for
          # Updates…" behind a configured pubkey, so an unsigned build simply
          # ships without in-app updates rather than failing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          overrides='{}'
          merge() {
            overrides="$(python - "$overrides" "$1" <<'PY'
          import json, sys

          def deep_merge(base, extra):
              for key, value in extra.items():
                  if isinstance(value, dict) and isinstance(base.get(key), dict):
                      deep_merge(base[key], value)
                  else:
                      base[key] = value
              return base

          print(json.dumps(deep_merge(json.loads(sys.argv[1]), json.loads(sys.argv[2]))))
          PY
          )"
          }

          if [[ -n "${TAURI_UPDATER_PUBKEY}" ]]; then
            # Updater artifacts and their signatures are only produced when the
            # release actually has a key to sign them with.
            merge "{\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"${TAURI_UPDATER_PUBKEY}\",\"endpoints\":[\"https://github.com/use-agent-os/agent-os/releases/latest/download/latest.json\"]}}}"
          fi

          # tauri.conf.json pins signingIdentity to "-" (ad-hoc), which is what
          # ships. A real Developer ID has to override it here rather than rely
          # on the APPLE_SIGNING_IDENTITY environment variable, because the
          # config value wins over the environment.
          if [[ "${RUNNER_OS}" == "macOS" && -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            merge "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"${APPLE_SIGNING_IDENTITY}\"}}}"
          fi

          # A merge that produced nothing is a bug, not "no overrides": passing
          # `--config ""` would fail the build with an unrelated parse error.
          if [[ -z "${overrides}" ]]; then
            echo "config merge produced no output" >&2
            exit 1
          fi

          args=()
          if [[ "${overrides}" != "{}" ]]; then
            echo "tauri config overrides: ${overrides}"
            args+=(--config "${overrides}")
          fi
          cargo tauri build "${args[@]}"

      - name: Collect installers
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          # One flat directory per platform, so the release step does not have
          # to know each bundler's output layout.
          bundle = Path("desktop/src-tauri/target/release/bundle")
          out = Path("dist/desktop")
          out.mkdir(parents=True, exist_ok=True)

          # Both macOS architectures emit the same updater artifact name, and
          # the release job merges every platform's directory flat -- so the
          # arch goes into the filename here, where the platform is known.
          platform_tag = os.environ["PLATFORM_TAG"]
          arch = {"macos-arm64": "aarch64", "macos-x64": "x64"}.get(platform_tag, "")
          renames = {
              "AgentOS.app.tar.gz": f"AgentOS_{arch}.app.tar.gz",
              "AgentOS.app.tar.gz.sig": f"AgentOS_{arch}.app.tar.gz.sig",
          }

          wanted = (".dmg", ".msi", ".exe", ".AppImage", ".deb", ".sig", ".tar.gz", ".zip")
          found = []
          for path in sorted(bundle.rglob("*")):
              if not path.is_file() or not path.name.endswith(wanted):
                  continue
              # The macOS `app` target materializes AgentOS.app itself under
              # the bundle tree; anything inside it is runtime payload, not an
              # installer, and must never ride along as a release asset.
              if any(part.endswith(".app") for part in path.parent.parts):
                  continue
              name = renames.get(path.name, path.name)
              shutil.copy2(path, out / name)
              found.append(name)

          assert found, f"no installers produced under {bundle}"
          print("\n".join(found))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### {os.environ['PLATFORM_TAG']}\n\n")
              for name in found:
                  size = (out / name).stat().st_size / (1024 * 1024)
                  summary.write(f"- `{name}` ({size:.0f} MB)\n")
          PY
        env:
          PLATFORM_TAG: ${{ matrix.platform_tag }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform_tag }}
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to release
    needs: build
    if: needs.build.result == 'success' && (github.event_name == 'push' || github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true

      # Only produced when the build actually signed updater artifacts (the
      # TAURI_SIGNING_PRIVATE_KEY secret is set). The updater plugin polls
      # `releases/latest/download/latest.json`; `cargo tauri build` emits the
      # signed payloads but not the manifest, so without this step a build
      # carrying TAURI_UPDATER_PUBKEY would offer "Check for Updates…" that can
      # never answer.
      - name: Compose the updater manifest
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          dist = Path("dist")
          names = {path.name for path in dist.iterdir() if path.is_file()}
          if not any(name.endswith(".sig") for name in names):
              print("no signed updater artifacts; skipping latest.json")
              sys.exit(0)

          versions = {
              match.group(1)
              for name in names
              if (match := re.fullmatch(r"AgentOS_(.+)_(?:aarch64|x64)\.dmg", name))
          }
          if len(versions) != 1:
              sys.exit(f"cannot derive one version from the DMGs: {sorted(names)}")
          version = versions.pop()

          base = (
              f"https://github.com/{os.environ['REPO']}/releases/download/"
              f"{os.environ['RELEASE_TAG']}"
          )
          # The updater artifact per platform, in tauri's platform-key terms.
          artifacts = {
              "darwin-aarch64": "AgentOS_aarch64.app.tar.gz",
              "darwin-x86_64": "AgentOS_x64.app.tar.gz",
              "linux-x86_64": f"AgentOS_{version}_amd64.AppImage",
              "windows-x86_64": f"AgentOS_{version}_x64-setup.exe",
          }
          platforms = {}
          for key, artifact in artifacts.items():
              signature = dist / f"{artifact}.sig"
              if artifact in names and signature.is_file():
                  platforms[key] = {
                      "signature": signature.read_text(encoding="utf-8").strip(),
                      "url": f"{base}/{artifact}",
                  }
              else:
                  print(f"note: no updater artifact for {key}", file=sys.stderr)

          if not platforms:
              sys.exit("signatures exist but no platform entry could be built")

          manifest = {
              "version": version,
              "pub_date": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "platforms": platforms,
          }
          (dist / "latest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(f"latest.json covers: {', '.join(sorted(platforms))}")
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no desktop assets to publish" >&2
            exit 1
          fi

          # The GitHub release itself is created by wheelhouse-release.yml,
          # which runs on the same tag but on its own clock. Uploading into a
          # release that does not exist yet fails, so wait for it -- and if the
          # wheelhouse run died, fail here loudly rather than half-publish.
          for _ in $(seq 60); do
            if gh release view "${RELEASE_TAG}" --repo "${REPO}" >/dev/null 2>&1; then
              break
            fi
            echo "release ${RELEASE_TAG} does not exist yet; waiting"
            sleep 30
          done
          if ! gh release view "${RELEASE_TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} never appeared; is wheelhouse-release green?" >&2
            exit 1
          fi

          gh release upload "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${REPO}" --clobber

  homebrew:
    name: Update Homebrew cask
    # Only after the assets are attached: the cask's URLs have to resolve by
    # the time anyone can `brew install` it.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # `main`, not the tag. This repository is its own tap, and `brew tap`
      # reads a tap's default branch only -- a cask committed onto the tag
      # would never be seen.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the macOS installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: desktop-macos-*
          merge-multiple: true

      - name: Render the cask
        shell: bash
        run: |
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "no release tag to render a cask for" >&2
            exit 1
          fi
          python scripts/render_homebrew_cask.py \
            --tag "${RELEASE_TAG}" \
            --dmg-dir dist \
            --output Casks/agentos.rb
          cat Casks/agentos.rb

      # `main` is protected with enforce_admins on, so nothing pushes to it
      # directly. It requires a pull request but zero approvals and no status
      # checks, which is exactly enough room to open one and merge it in the
      # same job -- no human step, and no token beyond the run's own. One more
      # switch has to be on for that token to open the pull request at all:
      # Settings -> Actions -> General -> "Allow GitHub Actions to create and
      # approve pull requests" (org repos default it to off). RELEASES.md's
      # "Homebrew tap" section carries the full precondition list.
      - name: Open and merge the cask update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Staged, not worktree: before the first desktop release the cask is
          # an untracked file, which `git diff` reports as no change at all --
          # the update would skip itself forever. Re-running an already-merged
          # tag renders byte-identical output and stages nothing, which is the
          # case this guard is for: `git commit` errors on an empty tree.
          git add Casks/agentos.rb
          if git diff --cached --quiet; then
            echo "the cask on main already describes ${RELEASE_TAG}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          branch="homebrew-cask/${RELEASE_TAG}"
          git checkout -b "${branch}"
          git commit -m "chore(homebrew): point the cask at ${RELEASE_TAG}"

          # Plain --force, deliberately: the branch namespace is machine-owned
          # and per-tag, and a fresh clone has no remote-tracking ref for it,
          # so --force-with-lease would reject exactly the retry it exists to
          # protect -- a re-run recovering from a failed merge.
          git push --force origin "${branch}"

          # A previous run may have opened the pull request and then failed to
          # merge it; creating a second one for the same head errors, so reuse.
          # Probed with `gh pr view` because it shares `gh pr merge`'s finder
          # (same-repo heads only) -- `gh pr list --head` also matches a fork
          # branch of the same name, which would skip the create here and then
          # find nothing to merge below, wedging the publish on a squatted name.
          state="$(gh pr view "${branch}" --json state --jq .state 2>/dev/null || true)"
          if [[ "${state}" != "OPEN" ]]; then
            gh pr create --base main --head "${branch}" \
              --title "chore(homebrew): point the cask at ${RELEASE_TAG}" \
              --body "Generated by the desktop release workflow from the \
          installers built for ${RELEASE_TAG}. The version and both checksums \
          come from those artifacts; see \`packaging/homebrew/agentos.rb\` for \
          the template and \`scripts/render_homebrew_cask.py\` for the renderer."
          fi

          # GitHub computes mergeability asynchronously, so the merge can
          # arrive before the answer does. Retry rather than leave a release
          # half-published.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "${branch}" --squash --delete-branch; then
              exit 0
            fi
            echo "merge attempt ${attempt} failed; retrying"
            sleep 10
          done

          echo "could not merge the cask update; merge ${branch} by hand" >&2
          exit 1
